<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D1320">
    <title>Paranoma</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        html, body { margin: 0; height: 100%; background: #0D1320; overflow: hidden; }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; }
    </style>
</head>
<body>
<div id="loading">
    <svg width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#2A3550" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#4C8DFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
</div>
<script type="application/javascript" src="paranoma.js"></script>
</body>
</html>
