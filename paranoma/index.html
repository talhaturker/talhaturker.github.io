<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D1320">
    <title>Paranoma</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        html, body { margin: 0; height: 100%; background: #0D1320; overflow: hidden; }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; }
        #busy { display: none; color: #C9D3E6; font: 15px/1.5 system-ui, sans-serif; text-align: center; padding: 0 24px; }
    </style>
</head>
<body>
<div id="loading">
    <svg width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#2A3550" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#4C8DFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
</div>
<p id="busy">Paranoma başka bir sekmede açık.<br>O sekmeyi kapatınca burada kendiliğinden açılır.</p>
<script>
    // Tarayıcı veritabanını (OPFS) aynı anda yalnız bir sekme açabilir; ikinci sekme boş, geçici bir veritabanına
    // düşmesin diye kilit alınır. Kilit başka sekmedeyse o kapanana kadar beklenir; sayfa açık kaldıkça kilit tutulur.
    function start() {
        const script = document.createElement('script');
        script.src = 'paranoma.js';
        document.body.appendChild(script);
    }
    if (navigator.locks) {
        const busy = setTimeout(() => { document.getElementById('busy').style.display = 'block'; }, 1500);
        navigator.locks.request('paranoma-db', () => {
            clearTimeout(busy);
            document.getElementById('busy').style.display = 'none';
            start();
            return new Promise(() => {});
        });
    } else {
        start();
    }
</script>
</body>
</html>
